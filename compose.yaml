services:
  db:
    image: postgres:17.10
    ports: ["127.0.0.1:${POSTGRES_PORT:-55432}:5432"]
    environment:
      POSTGRES_USER: iml
      POSTGRES_DB: iml
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}
    volumes: ["iml_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iml -d iml"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  iml_pgdata:
